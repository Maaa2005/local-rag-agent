services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:6333:6333"  # 無認証のためLAN非公開
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  vllm:
    build:
      context: ./inference
      dockerfile: Dockerfile
    # 項目10: latest は再現性・脆弱性追跡の観点で避け、具体バージョンに固定する。
    restart: unless-stopped
    runtime: nvidia
    # GPU 利用 (nvidia runtime) とモデル/キャッシュ書込の都合上、
    # read_only 化・cap_drop は行わずバージョン固定と no-new-privileges のみ適用する。
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8001:8000"  # 権限フィルタ回避防止のためループバック限定
    volumes:
      - llm_cache:/root/.cache/huggingface
      - ./models/hr-orchestrator:/models/hr-orchestrator:ro
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    # 6GB VRAM 向け: Gemma 4-E2B AWQ-INT4 (~2.5GB重み) gpu-memory-utilization=0.6
    # embedding は CPU 動作のため VRAM 専有なし
    # The AWQ file is about 7.1 GB. The default profile supports a 6 GB GPU by
    # offloading part of the model to system RAM. Set CPU_OFFLOAD_GB=0 on a
    # GPU with enough VRAM for better performance.
    command: >
      --model ${BASE_MODEL:-cyankiwi/gemma-4-E2B-it-AWQ-INT4}
      --dtype auto
      --max-model-len ${MAX_MODEL_LEN:-2048}
      --max-num-seqs ${MAX_NUM_SEQS:-1}
      --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS:-512}
      --kv-cache-memory-bytes ${KV_CACHE_MEMORY_BYTES:-67108864}
      --kv-cache-dtype bfloat16
      --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.8}
      --cpu-offload-gb ${CPU_OFFLOAD_GB:-4}
      --language-model-only
      --skip-mm-profiling
      --enforce-eager
      --served-model-name local-llm
      --enable-lora
      --max-lora-rank 8
      --lora-modules hr-orchestrator=/models/hr-orchestrator
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # 項目10: 非root実行 (Dockerfile 側で USER app) + 最小権限化。
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "8000:8000"
    volumes:
      - ./volumes/watched:/watched:ro
      - sqlite_data:/app/data
      - embed_cache:/home/app/.cache/huggingface
    environment:
      - QDRANT_URL=http://qdrant:6333
      - VLLM_BASE_URL=http://vllm:8000/v1
      - LLM_MODEL=${LLM_SERVED_MODEL:-local-llm}
      - ORCHESTRATOR_ENABLED=${ORCHESTRATOR_ENABLED:-true}
      - ORCHESTRATOR_MODEL=${ORCHESTRATOR_MODEL:-hr-orchestrator}
      - ORCHESTRATOR_MAX_TOKENS=${ORCHESTRATOR_MAX_TOKENS:-255}
      - ORCHESTRATOR_REQUIRED=${ORCHESTRATOR_REQUIRED:-true}
      - EMBED_MODEL=${EMBED_MODEL:-intfloat/multilingual-e5-large}
      - WATCHED_PATH=/watched
      - DATA_DIR=/app/data
      - SECRET_KEY=${SECRET_KEY:-}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
    depends_on:
      - qdrant
      - vllm

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # 項目10: nginxinc/nginx-unprivileged (非root・非特権ポート8080) を使用。
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "3000:8080"
    depends_on:
      - backend

volumes:
  qdrant_data:
  sqlite_data:
  llm_cache:
  embed_cache:
