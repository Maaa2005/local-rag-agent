server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 項目中5: HTML/JS/CSS を配信するここで CSP を付与する。
    # index.html にインライン script/style は無い (style 属性含む) ため
    # 'unsafe-inline' 等は許可せず、外部ファイル (style.css / app.js) のみを許可する。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # API proxy — backend runs at http://backend:8000
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        # SSE requires unbuffered streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
